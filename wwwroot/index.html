<!DOCTYPE html>
<html>

<head>
    <!-- Google Tag Manager -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VM01Q3R43D"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-VM01Q3R43D');
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Chain Reaction - Classic cartoon-themed strategic multiplayer game. Join the chase and outsmart your opponents!" />
    <meta name="keywords" content="Chain Reaction, multiplayer game, cartoon game, strategy game" />
    <title>🐱🐭 Chain Reaction | Classic Cartoon Game</title>
    <base href="/ChainReaction/" />
    <style>
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .loadinBaba { 
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0; 
            display: flex;
            flex-direction: column;
            gap: 30px;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #87CEEB 0%, #F5DEB3 50%, #FFD700 100%);
            animation: bg-shift 5s ease-in-out infinite;
        }
        .loading-text {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(90deg, #FF6B6B, #4ECDC4, #FFD93D, #6BCF7F, #FF6B6B);
            background-size: 300% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            animation: shimmer 2s linear infinite, bounce-cartoon 1.5s ease-in-out infinite;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            text-align: center;
            padding: 0 20px;
        }
        .loading-subtitle {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-size: 20px;
            font-weight: 700;
            color: #8B4513;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.7);
            animation: wiggle 2s ease-in-out infinite;
        }
        .cheese-loader {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            border: 5px solid #8B5A2B;
            position: relative;
            animation: rotate-cheese 2s linear infinite;
            box-shadow: 0 10px 40px rgba(255,215,0,0.5);
        }
        .cheese-hole {
            position: absolute;
            background: #F5DEB3;
            border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }
        .hole1 { width: 20px; height: 20px; top: 20px; left: 30px; }
        .hole2 { width: 25px; height: 25px; top: 50px; right: 20px; }
        .hole3 { width: 18px; height: 18px; bottom: 25px; left: 45px; }
        .hole4 { width: 22px; height: 22px; bottom: 35px; right: 35px; }
        @keyframes shimmer {
            to { background-position: 300% center; }
        }
        @keyframes bounce-cartoon {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }
        @keyframes rotate-cheese {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes bg-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        html { scroll-behavior: smooth; }
        @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
        @keyframes scale-in { 0% { transform: translateY(8px) scale(0.97) } 100% { transform: translateY(0) scale(1) } }
        @keyframes slide-up { from { transform: translateY(20px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
        @keyframes bounce-subtle { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
        .animate-fade-in { animation: fade-in 150ms ease-out; }
        .animate-scale-in { animation: scale-in 200ms ease-out; }
        .animate-slide-up { animation: slide-up 300ms ease-out; }
        .animate-bounce-subtle { animation: bounce-subtle 2s ease-in-out infinite; }
        
        /* Responsive loading text */
        @media (max-width: 768px) {
            .loading-text {
                font-size: 28px;
            }
            .loading-subtitle {
                font-size: 16px;
            }
            .cheese-loader {
                width: 80px;
                height: 80px;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Chewy&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cartoon: ['"Comic Sans MS"', '"Chalkboard SE"', '"Comic Neue"', 'cursive'],
                        game: ['Bangers', 'cursive'],
                        fun: ['Chewy', 'cursive'],
                    },
                    animation: {
                        'fade-in': 'fade-in 0.15s ease-out',
                        'scale-in': 'scale-in 0.2s ease-out',
                        'slide-up': 'slide-up 0.3s ease-out',
                        'bounce-subtle': 'bounce-subtle 2s infinite',
                        'wiggle': 'wiggle 2s ease-in-out infinite',
                        'bounce-cartoon': 'bounce-cartoon 1.5s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <link href="app.css" rel="stylesheet" />
</head>

<body class="min-h-screen antialiased bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50">
    <div id="app">
        <div class="loading">
            <div class="loadinBaba">
                <div class="loading-text">Chain Reaction</div>
                <div class="cheese-loader">
                    <div class="cheese-hole hole1"></div>
                    <div class="cheese-hole hole2"></div>
                    <div class="cheese-hole hole3"></div>
                    <div class="cheese-hole hole4"></div>
                </div>
                <div class="loading-subtitle">🐱 Loading the Chase... 🐭</div>
            </div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="dimendion.js"></script>
    <script src="feedback.js"></script>
</body>

</html>
