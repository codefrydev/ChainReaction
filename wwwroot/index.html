    <style>
        /* Loading screen */
        .app-loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            background: linear-gradient(to bottom right, #fffbeb, #fef9c3, #ffedd5);
            overflow: hidden;
        }

        .app-loading-card {
            width: 100%;
            max-width: 22rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            padding: 1.5rem 1.25rem;
            border-radius: 1.25rem;
            background: rgba(255, 251, 235, 0.92);
            border: 4px solid rgba(180, 83, 9, 0.35);
            box-shadow: 0 20px 50px rgba(180, 83, 9, 0.15);
            text-align: center;
        }

        .app-loading-emojis {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 1.75rem;
        }

        @media (min-width: 640px) {
            .app-loading-emojis {
                font-size: 2.25rem;
                gap: 1rem;
            }
        }

        .app-loading-title {
            font-family: 'Chewy', 'Comic Sans MS', cursive;
            font-size: 1.75rem;
            font-weight: 900;
            line-height: 1.1;
            background: linear-gradient(to right, #2563eb, #d97706, #ea580c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        @media (min-width: 640px) {
            .app-loading-title {
                font-size: 2.25rem;
            }
        }

        .app-loading-subtitle {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-size: 0.875rem;
            font-weight: 700;
            color: #92400e;
        }

        /* Mini orb board animation */
        .orb-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 10px;
            border-radius: 12px;
            background: linear-gradient(135deg, #fff8dc, #ffeaa7);
            border: 3px solid #d4a574;
            box-shadow: inset 0 2px 8px rgba(139, 90, 43, 0.12);
        }

        .orb-cell {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 6px;
            background: linear-gradient(135deg, #fff8dc, #ffeaa7);
            border: 2px solid #d4a574;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @media (min-width: 640px) {
            .orb-cell {
                width: 2.75rem;
                height: 2.75rem;
            }
        }

        .orb-dot {
            width: 55%;
            height: 55%;
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.4);
            animation: orb-pop 2.4s ease-in-out infinite;
        }

        .orb-dot.c1 { background: #4682b4; animation-delay: 0s; }
        .orb-dot.c2 { background: #cd853f; animation-delay: 0.3s; }
        .orb-dot.c3 { background: #ff8c00; animation-delay: 0.6s; }
        .orb-dot.c4 { background: #ffd700; animation-delay: 0.9s; }
        .orb-dot.c5 { background: #3cb371; animation-delay: 1.2s; }
        .orb-dot.c6 { background: #9370db; animation-delay: 1.5s; }
        .orb-dot.c7 { background: #4682b4; animation-delay: 1.8s; }
        .orb-dot.c8 { background: #ff8c00; animation-delay: 2.1s; }
        .orb-dot.c9 { background: #cd853f; animation-delay: 0.45s; }

        @keyframes orb-pop {
            0%, 100% { opacity: 0; transform: scale(0.4); }
            15%, 55% { opacity: 1; transform: scale(1); }
            70% { opacity: 0.3; transform: scale(0.7); }
        }

        .app-loading-bar {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(217, 119, 6, 0.15);
            overflow: hidden;
            border: 1px solid rgba(217, 119, 6, 0.25);
        }

        .app-loading-bar-fill {
            height: 100%;
            width: 35%;
            border-radius: 999px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
            background-size: 200% 100%;
            animation: loading-bar-slide 1.4s ease-in-out infinite;
        }

        @keyframes loading-bar-slide {
            0% { transform: translateX(-120%); background-position: 0% 50%; }
            100% { transform: translateX(320%); background-position: 100% 50%; }
        }

        .app-loading-hint {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-size: 0.75rem;
            color: rgba(146, 64, 14, 0.75);
        }

        @media (prefers-reduced-motion: reduce) {
            .orb-dot,
            .app-loading-bar-fill {
                animation: none;
            }
            .orb-dot {
                opacity: 0.85;
                transform: scale(1);
            }
            .app-loading-bar-fill {
                width: 60%;
                transform: none;
            }
        }

        html { scroll-behavior: smooth; }
        @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
        @keyframes scale-in { 0% { transform: translateY(8px) scale(0.97) } 100% { transform: translateY(0) scale(1) } }
        @keyframes slide-up { from { transform: translateY(20px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
        @keyframes bounce-subtle { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
        .animate-fade-in { animation: fade-in 150ms ease-out; }
        .animate-scale-in { animation: scale-in 200ms ease-out; }
        .animate-slide-up { animation: slide-up 300ms ease-out; }
        .animate-bounce-subtle { animation: bounce-subtle 2s ease-in-out infinite; }

        @keyframes bounce-cartoon {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }
    </style>
